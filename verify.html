<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademark Verification Portal - DPDT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- Top Govt. Green Bar -->
    <div class="bg-[#006a4e] text-white text-center py-2 text-xs md:text-sm font-semibold">
        Government of the People's Republic of Bangladesh
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 bg-white mt-6 shadow-sm border border-gray-200">
        
        <!-- Header Title -->
        <h2 class="text-xl md:text-2xl font-bold text-[#006a4e] mb-1">Department of Patents, Designs & Trademarks</h2>
        <p class="text-xs md:text-sm text-gray-500 mb-6 font-medium">Trademark Verification Portal</p>

        <!-- Search Form Box -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="tmInput" placeholder="e.g. 245788" class="border border-gray-300 px-3 py-1.5 text-sm rounded-xs w-64 focus:outline-none focus:border-[#006a4e]">
            <button onclick="processVerification()" class="bg-[#006a4e] text-white text-sm font-semibold px-5 py-1.5 rounded-xs hover:bg-green-800 transition flex items-center justify-center min-w-[90px] cursor-pointer">
                <span id="btnText">Verify</span>
                <!-- Loading Spinner -->
                <svg id="spinner" class="hidden animate-spin ml-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Result Section (Initially Hidden) -->
        <div id="resultSection" class="hidden">
            <table class="w-full border-collapse border border-gray-200 text-sm text-left mb-6">
                <tbody>
                    <tr class="border-b border-gray-200">
                        <th class="bg-gray-50 border-r border-gray-200 p-2.5 w-1/3 font-semibold text-gray-700">Trademark Number</th>
                        <td id="resNum" class="p-2.5 font-medium text-gray-900"></td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <th class="bg-gray-50 border-r border-gray-200 p-2.5 font-semibold text-gray-700">Owner / Proprietor</th>
                        <td id="resOwner" class="p-2.5 text-gray-900"></td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <th class="bg-gray-50 border-r border-gray-200 p-2.5 font-semibold text-gray-700">Status</th>
                        <td id="resStatus" class="p-2.5 text-green-600 font-bold tracking-wide uppercase text-xs"></td>
                    </tr>
                    <tr>
                        <th class="bg-gray-50 border-r border-gray-200 p-2.5 font-semibold text-gray-700">Authority</th>
                        <td id="resAuth" class="p-2.5 text-gray-600"></td>
                    </tr>
                </tbody>
            </table>

            <!-- Main Certificate JPG/PNG Frame -->
            <div class="border border-gray-200 p-1 bg-white mb-6 flex justify-center">
                <img id="certificateImg" src="" alt="Trademark Certificate" class="max-w-full h-auto">
            </div>

            <!-- Bottom Success Alert Bar -->
            <div class="bg-green-50 border-l-4 border-green-600 text-green-800 p-3 text-xs md:text-sm font-medium">
                ✓ This trademark certificate has been verified successfully.
            </div>
        </div>

        <!-- Error Alert -->
        <div id="errorSection" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-xs md:text-sm font-medium">
            ✗ Trademark number not found or unverified.
        </div>
    </div>

    <!-- Script Logics -->
    <script>
        function processVerification() {
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultSection = document.getElementById('resultSection');
            const errorSection = document.getElementById('errorSection');

            resultSection.classList.add('hidden');
            errorSection.classList.add('hidden');

            // Show checking status animation
            btnText.innerText = "Checking...";
            spinner.classList.remove('hidden');

            // 1.2 Second artificial delay to make it look official
            setTimeout(() => {
                btnText.innerText = "Verify";
                spinner.classList.add('hidden');
                verifyTrademark();
            }, 1200);
        }

        async function verifyTrademark() {
            const inputVal = document.getElementById('tmInput').value.trim();
            const resultSection = document.getElementById('resultSection');
            const errorSection = document.getElementById('errorSection');

            if (!inputVal) return;

            try {
                const response = await fetch('data.json');
                const data = await response.json();

                if (data[inputVal]) {
                    const tmData = data[inputVal];
                    
                    // Bind data inside the UI table fields
                    document.getElementById('resNum').innerText = tmData.trademark_no;
                    document.getElementById('resOwner').innerText = tmData.owner_or_proprietor;
                    document.getElementById('resStatus').innerText = tmData.status;
                    document.getElementById('resAuth').innerText = tmData.authority;
                    
                    // Dynamic Image bind frame
                    document.getElementById('certificateImg').src = tmData.certificate_image;

                    resultSection.classList.remove('hidden');
                    errorSection.classList.add('hidden');
                } else {
                    resultSection.classList.add('hidden');
                    errorSection.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Database connection issue:", error);
                errorSection.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
