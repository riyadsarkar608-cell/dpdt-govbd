<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Trademark Verification</title>
    <style>
        /* BODY */
        body{
            margin:0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:#f8f9fa;
            color: #333;
        }
        /* HEADER WITH SEAL ALIGNMENT */
        .header{
            background:#006a4e;
            color:white;
            padding:12px 15px;
            text-align:center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: bold;
            font-size: 16px;
        }
        .header img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
        /* GOVT ORANGE STRIP */
        .gov-bar {
            height: 4px;
            background: #f47920;
            width: 100%;
        }
        /* MAIN BOX */
        .container{
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            border: 1px solid #e0e0e0;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        /* LOGO */
        .logo{
            width: 85px;
            height: auto;
        }
        /* TITLE */
        .title{
            color: #006a4e;
            margin-top: 12px;
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: 700;
        }
        .subtitle {
            margin: 0;
            color: #666;
            font-size: 15px;
            font-weight: 500;
        }
        /* SEARCH */
        .search{
            margin-top: 25px;
            margin-bottom: 25px;
        }
        input{
            padding: 12px;
            width: 280px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #006a4e;
        }
        button{
            padding: 12px 24px;
            background: #006a4e;
            color: white;
            border: 1px solid #006a4e;
            border-radius: 0 4px 4px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-left: -5px;
        }
        button:hover{
            background: #004d39;
        }
        /* TABLE */
        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: #fff;
        }
        table td{
            border: 1px solid #e0e0e0;
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
        }
        table tr td:first-child {
            background: #fbfbfb;
            color: #555;
            width: 25%;
            font-weight: 600;
        }
        /* VERIFIED BADGE STYLE */
        .status-badge {
            background: #e6f4ea;
            color: #137333;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            border: 1px solid #ceead6;
        }
        /* CERTIFICATE */
        .cert-img{
            width: 100%;
            max-width: 850px;
            margin-top: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        /* PDF */
        iframe{
            width: 100%;
            height: 850px;
            border: 1px solid #ddd;
            margin-top: 25px;
            border-radius: 4px;
        }
        /* VERIFIED LOWER BOX */
        .verified{
            margin-top: 25px;
            padding: 14px;
            background: #e6f4ea;
            border: 1px solid #ceead6;
            color: #137333;
            font-weight: 600;
            border-radius: 4px;
            font-size: 15px;
        }
        /* INVALID */
        .invalid{
            margin-top: 25px;
            padding: 15px;
            background: #fce8e6;
            border: 1px solid #fad2cf;
            color: #c5221f;
            font-weight: bold;
            border-radius: 4px;
        }
        /* FOOTER */
        .footer{
            background: #202124;
            color: #bcbcf2;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
            font-size: 13px;
            border-top: 3px solid #006a4e;
        }
        /* MOBILE RESPONSIVE */
        @media(max-width:768px){
            .container { margin: 15px; padding: 15px; }
            input{ width: 100%; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; }
            button{ width: 100%; border-radius: 4px; margin-left: 0; }
            .title{ font-size: 20px; }
            table tr td:first-child { width: 35%; }
            .header{ font-size: 13px; gap: 8px; padding: 10px; }
            .header img { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="seal.png" alt="BD Government Seal">
        <span>Government of the People's Republic of Bangladesh</span>
    </div>
    <div class="gov-bar"></div>

    <div class="container">
        <img src="logo.jpeg" class="logo" alt="Logo">
        
        <h2 class="title">Department of Patents, Designs & Trademarks</h2>
        <p class="subtitle">Trademark Verification Portal</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin-top: 15px;">

        <div class="search">
            <input type="text" id="tm" placeholder="Enter Trademark Number">
            <button onclick="searchTM()">Verify</button>
        </div>

        <div id="result"></div>
    </div>

    <div class="footer">
        © 2026 Department of Patents, Designs & Trademarks, Bangladesh | All Rights Reserved.
    </div>

<script>
    /* SEARCH FUNCTION */
    function searchTM(){
        let id = document.getElementById("tm").value.trim();
        if(id){
            window.location.href = "?id=" + id;
        }
    }

    /* GET QUERY PARAMETER FROM URL */
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    /* IF ID EXISTS, LOAD DATA */
    if(id){
        document.getElementById("tm").value = id;
        loadTrademarkData(id);
    }

    /* FETCH DATA FROM DATA.JSON */
    function loadTrademarkData(tmId) {
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                if (data[tmId]) {
                    let tmDetails = data[tmId];
                    // Variable set default placeholder values if not provided in JSON
                    let appDate = tmDetails.application_date || "08/12/2015";
                    let tmClass = tmDetails.class || "Class 41";
                    let tmType = tmDetails.type || "Device / Logo";

                    checkFilesAndShow(tmId, tmDetails.name, tmDetails.authority, appDate, tmClass, tmType);
                } else {
                    showInvalid();
                }
            })
            .catch(() => {
                showInvalid();
            });
    }

    /* DETECT IMAGE OR PDF AND RENDER */
    function checkFilesAndShow(tmId, ownerName, authorityName, appDate, tmClass, tmType) {
        let imgUrl = tmId + ".jpg";
        let img = new Image();
        
        img.onload = function() {
            showVerifiedHTML(tmId, ownerName, authorityName, appDate, tmClass, tmType, `<img class="cert-img" src="${imgUrl}">`);
        };
        
        img.onerror = function() {
            let pdfUrl = tmId + ".pdf";
            fetch(pdfUrl)
                .then(response => {
                    if (response.ok) {
                        showVerifiedHTML(tmId, ownerName, authorityName, appDate, tmClass, tmType, `<iframe src="${pdfUrl}"></iframe>`);
                    } else {
                        showVerifiedHTML(tmId, ownerName, authorityName, appDate, tmClass, tmType, '');
                    }
                })
                .catch(() => showVerifiedHTML(tmId, ownerName, authorityName, appDate, tmClass, tmType, ''));
        };
        
        img.src = imgUrl;
    }

    /* RENDER DYNAMIC VERIFIED INTERFACE */
    function showVerifiedHTML(tmId, ownerName, authorityName, appDate, tmClass, tmType, displayContent) {
        document.getElementById("result").innerHTML = `
            <table>
                <tr>
                    <td>Trademark Number</td>
                    <td style="font-weight: 600;">${tmId}</td>
                </tr>
                <tr>
                    <td>Owner / Brand Name</td>
                    <td style="font-weight: 700; color: #111;">${ownerName}</td>
                </tr>
                <tr>
                    <td>Trademark Class</td>
                    <td>${tmClass}</td>
                </tr>
                <tr>
                    <td>Trademark Type</td>
                    <td>${tmType}</td>
                </tr>
                <tr>
                    <td>Filing/Application Date</td>
                    <td>${appDate}</td>
                </tr>
                <tr>
                    <td>Status</td>
                    <td><span class="status-badge">✔ VERIFIED</span></td>
                </tr>
                <tr>
                    <td>Authority</td>
                    <td>${authorityName}</td>
                </tr>
            </table>
            ${displayContent}
            <div class="verified">
                ✔ This trademark certificate has been verified successfully against the dynamic national intellectual property index.
            </div>
        `;
    }

    /* DISPLAY INVALID IF NOT FOUND */
    function showInvalid() {
        document.getElementById("result").innerHTML = `
            <div class="invalid">
                ❌ Invalid Trademark Number. No active records matching this identity were found in the server registry.
            </div>
        `;
    }
</script>

</body>
</html>
