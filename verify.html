<script>

function searchTM(){

let id=document.getElementById("tm").value.trim();

window.location.href="?id="+id;

}

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

if(id){

document.getElementById("tm").value=id;

fetch("data.json")

.then(res=>res.json())

.then(data=>{

if(!data[id]){

showInvalid();

return;

}

let owner=data[id].owner;

document.getElementById("result").innerHTML=`

<table>

<tr>
<td><b>Trademark Number</b></td>
<td>${id}</td>
</tr>

<tr>
<td><b>Owner Name</b></td>
<td>${owner}</td>
</tr>

<tr>
<td><b>Status</b></td>
<td style="color:green;">VERIFIED ✅</td>
</tr>

<tr>
<td><b>Authority</b></td>
<td>Department of Patents, Designs & Trademarks</td>
</tr>

</table>

<img class="cert-img"
src="${id}.jpg"
onerror="showPDF('${id}','${owner}')">

<div class="verified">

✔ This trademark certificate has been verified successfully.

</div>

`;

})

.catch(()=>{

showInvalid();

});

}

function showPDF(id,owner){

fetch(id + ".pdf")

.then(response=>{

if(response.ok){

document.getElementById("result").innerHTML=`

<table>

<tr>
<td><b>Trademark Number</b></td>
<td>${id}</td>
</tr>

<tr>
<td><b>Owner Name</b></td>
<td>${owner}</td>
</tr>

<tr>
<td><b>Status</b></td>
<td style="color:green;">VERIFIED ✅</td>
</tr>

<tr>
<td><b>Authority</b></td>
<td>Department of Patents, Designs & Trademarks</td>
</tr>

</table>

<iframe src="${id}.pdf"></iframe>

<div class="verified">

✔ This trademark certificate has been verified successfully.

</div>

`;

}else{

showInvalid();

}

})

.catch(()=>{

showInvalid();

});

}

function showInvalid(){

document.getElementById("result").innerHTML=`

<div class="invalid">

❌ Invalid Trademark Number

</div>

`;

}

</script>
