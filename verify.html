<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Trademark Verification</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: white; }
        .header { background: #006a4e; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 1000px; margin: 30px auto; background: white; border: 1px solid #ccc; padding: 25px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
        .logo { width: 90px; }
        .title { color: #006a4e; margin-top: 10px; font-size: 28px; }
        .search { margin-top: 25px; }
        input { padding: 12px; width: 260px; font-size: 16px; border: 1px solid #999; outline: none; }
        button { padding: 12px 20px; background: #006a4e; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background: #004d39; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        .cert-img { width: 100%; max-width: 850px; margin-top: 20px; border: 1px solid #ccc; }
        iframe { width: 100%; height: 850px; border: 1px solid #ccc; margin-top: 20px; }
        .verified { margin-top: 20px; padding: 12px; background: #f3fff7; border: 1px solid #cceedd; color: #006a4e; font-weight: bold; }
        .invalid { margin-top: 20px; padding: 15px; background: #ffecec; border: 1px solid red; color: red; font-weight: bold; }
        .footer { background: #006a4e; color: white; padding: 15px; text-align: center; margin-top: 40px; font-size: 14px; }
        @media(max-width:768px){ input { width: 90%; margin-bottom: 10px; } button { width: 95%; } .title { font-size: 22px; } }
    </style>
</head>
<body>

    <div class="header">Government of the People's Republic of Bangladesh</div>

    <div class="container">
        <img src="logo.jpeg" class="logo" alt="Logo">
        <h2 class="title">Department of Patents, Designs & Trademarks</h2>
        <p>Trademark Verification Portal</p>
        <hr>

        <div class="search">
            <input type="text" id="tm" placeholder="Enter Trademark Number">
            <button onclick="searchTM()">Verify</button>
        </div>

        <div id="result"></div>
    </div>

    <div class="footer">© 2026 Department of Patents, Designs & Trademarks, Bangladesh</div>

<script>
    function searchTM() {
        let id = document.getElementById("tm").value.trim();
        if(id) {
            window.location.href = "?id=" + id;
        }
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
        document.getElementById("tm").value = id;
        checkAndShowData(id);
    }

    function checkAndShowData(tmId) {
        // Prothome check korbe .jpg file ache kina
        let imgUrl = tmId + ".jpg";
        let img = new Image();
        
        img.onload = function() {
            showVerifiedHTML(tmId, `<img class="cert-img" src="${imgUrl}">`);
        };
        
        img.onerror = function() {
            // .jpg na thakle .pdf check korbe
            let pdfUrl = tmId + ".pdf";
            fetch(pdfUrl)
                .then(response => {
                    if (response.ok) {
                        showVerifiedHTML(tmId, `<iframe src="${pdfUrl}"></iframe>`);
                    } else {
                        showInvalid();
                    }
                })
                .catch(() => showInvalid());
        };
        
        img.src = imgUrl;
    }

    function showVerifiedHTML(tmId, displayContent) {
        document.getElementById("result").innerHTML = `
            <table>
                <tr>
                    <td><b>Trademark Number</b></td>
                    <td>${tmId}</td>
                </tr>
                <tr>
                    <td><b>Status</b></td>
                    <td style="color:green; font-weight:bold;">VERIFIED</td>
                </tr>
                <tr>
                    <td><b>Authority</b></td>
                    <td>Department of Patents, Designs & Trademarks</td>
                </tr>
            </table>
            ${displayContent}
            <div class="verified">
                ✔ This trademark certificate has been verified successfully.
            </div>
        `;
    }

    function showInvalid() {
        document.getElementById("result").innerHTML = `
            <div class="invalid">
                ❌ Invalid Trademark Number
            </div>
        `;
    }
</script>

</body>
</html>
