<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Bangladesh Trademark Verification
</title>

<style>

body{

font-family:Arial,sans-serif;

background:linear-gradient(
135deg,
#edf5ef,
#d7efe2
);

padding:20px;

text-align:center;

margin:0;

}

/* MAIN BOX */

.box{

background:rgba(255,255,255,0.96);

padding:25px;

border-radius:20px;

max-width:1000px;

margin:auto;

box-shadow:0 8px 25px rgba(0,0,0,0.15);

backdrop-filter:blur(10px);

}

/* LOGO */

.logo{

width:120px;

margin-top:10px;

}

/* TITLE */

.gov{

color:#006a4e;

font-size:32px;

margin-top:10px;

}

/* VERIFIED */

.verify{

color:#006a4e;

font-weight:bold;

font-size:18px;

margin-top:10px;

}

/* SEARCH */

input{

padding:14px;

width:280px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

outline:none;

}

button{

padding:14px 25px;

background:#006a4e;

color:white;

border:none;

font-size:16px;

cursor:pointer;

border-radius:10px;

transition:0.3s;

}

button:hover{

background:#004d39;

transform:scale(1.05);

}

/* CERTIFICATE IMAGE */

.cert-img{

width:100%;

max-width:850px;

margin-top:20px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,0.2);

animation:fade 0.5s ease;

}

/* PDF */

iframe{

width:100%;

height:900px;

border:none;

margin-top:20px;

border-radius:15px;

}

/* INVALID */

.invalid{

padding:20px;

background:#ffecec;

color:red;

font-weight:bold;

border:1px solid red;

margin-top:20px;

border-radius:10px;

font-size:20px;

}

/* VERIFIED BOX */

.verified-box{

margin-top:20px;

padding:15px;

background:#f2fff7;

border:1px solid #cceedd;

border-radius:10px;

}

/* FOOTER */

footer{

background:#006a4e;

color:white;

padding:18px;

margin-top:30px;

font-size:15px;

}

/* ANIMATION */

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* MOBILE */

@media(max-width:768px){

input{

width:90%;

margin-bottom:10px;

}

button{

width:95%;

}

.gov{

font-size:24px;

}

h1{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="box">

<!-- LOGO -->

<img src="logo.jpeg" class="logo">

<!-- GOVERNMENT TITLE -->

<h2 class="gov">

Government of the People's Republic of Bangladesh

</h2>

<p>

Department of Patents, Designs & Trademarks

</p>

<p class="verify">

✔ VERIFIED OFFICIAL DOCUMENT

</p>

<hr>

<!-- MAIN TITLE -->

<h1 style="color:#006a4e;">

Bangladesh Trademark Verification

</h1>

<!-- SEARCH -->

<input type="text"

id="tm"

placeholder="Enter Trademark Number">

<button onclick="searchTM()">

Verify

</button>

<br><br>

<!-- RESULT -->

<div id="result"></div>

</div>

<!-- FOOTER -->

<footer>

© 2024 Department of Patents,
Designs & Trademarks, Bangladesh.

</footer>

<script>

/* SEARCH FUNCTION */

function searchTM(){

let id=document.getElementById("tm").value;

window.location.href="?id="+id;

}

/* URL PARAM */

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

/* SHOW RESULT */

if(id){

document.getElementById("tm").value=id;

document.getElementById("result").innerHTML=`

<img class="cert-img"

src="${id}.jpg"

onerror="showPDF()">

<div class="verified-box">

<h3 style="color:#006a4e;">

✔ Officially Verified

</h3>

<p>

This trademark certificate has been
verified by the Department of Patents,
Designs & Trademarks.

</p>

</div>

`;

}

/* SHOW PDF */

function showPDF(){

fetch(id + ".pdf")

.then(response => {

if(response.ok){

document.getElementById("result").innerHTML=`

<iframe src="${id}.pdf"></iframe>

<div class="verified-box">

<h3 style="color:#006a4e;">

✔ Officially Verified

</h3>

<p>

This trademark certificate has been
verified by the Department of Patents,
Designs & Trademarks.

</p>

</div>

`;

}else{

showInvalid();

}

})

.catch(() => {

showInvalid();

});

}

/* INVALID */

function showInvalid(){

document.getElementById("result").innerHTML=`

<div class="invalid">

❌ Invalid Trademark Number

</div>

`;

}

</script>

</body>

</html>
