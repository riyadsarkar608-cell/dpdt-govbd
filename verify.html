<!DOCTYPE html>
<html>

<head>
  <title>Bangladesh Trademark Verification</title>

  <style>

    body{
      font-family:Arial;
      background:#f5f5f5;
      padding:20px;
      text-align:center;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:1000px;
      margin:auto;
    }

    input{
      padding:12px;
      width:250px;
      font-size:16px;
    }

    button{
      padding:12px 20px;
      background:green;
      color:white;
      border:none;
      font-size:16px;
      cursor:pointer;
    }

    img{
      width:100%;
      max-width:800px;
      margin-top:20px;
      border:1px solid #ddd;
    }

    iframe{
      width:100%;
      height:800px;
      border:none;
      margin-top:20px;
    }

  </style>

</head>

<body>

<div class="box">

<h1>Bangladesh Trademark Verification</h1>

<input type="text" id="tm" placeholder="Enter Trademark Number">

<button onclick="searchTM()">Verify</button>

<br><br>

<div id="result"></div>

</div>

<script>

function searchTM(){

  let id=document.getElementById("tm").value;

  window.location.href="?id="+id;

}

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

if(id){

document.getElementById("tm").value=id;

document.getElementById("result").innerHTML=`

<img src="${id}.jpg"
onerror="this.style.display='none';showPDF()">

`;

}

function showPDF(){

document.getElementById("result").innerHTML=`

<iframe src="${id}.pdf"></iframe>

`;

}

</script>

</body>

</html>
