<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademark Verification Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Top Banner -->
    <div class="bg-green-800 text-white text-center py-2 text-sm font-semibold">
        Government of the People's Republic of Bangladesh
    </div>

    <div class="max-w-4xl mx-auto p-6 bg-white mt-6 shadow-md rounded-lg">
        <h2 class="text-xl font-bold text-green-700 mb-4">Department of Patents, Designs & Trademarks</h2>
        <p class="text-sm text-gray-600 mb-6">Trademark Verification Portal</p>

        <!-- Search Box -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="tmInput" placeholder="Enter Trademark Number" class="border p-2 rounded w-64 focus:outline-none focus:ring-2 focus:ring-green-600">
            <button onclick="verifyTrademark()" class="bg-green-700 text-white px-6 py-2 rounded hover:bg-green-800 font-semibold">Verify</button>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden">
            <table class="w-full border-collapse border border-gray-300 text-left mb-6">
                <tr class="bg-gray-50">
                    <th class="border p-2 w-1/3">Trademark Number</th>
                    <td id="resNum" class="border p-2 font-semibold"></td>
                </tr>
                <tr>
                    <th class="border p-2">Status</th>
                    <td id="resStatus" class="border p-2 text-green-600 font-bold"></td>
                </tr>
                <tr class="bg-gray-50">
                    <th class="border p-2">Authority</th>
                    <td id="resAuth" class="border p-2"></td>
                </tr>
            </table>

            <!-- Success Alert -->
            <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-3 rounded text-sm font-medium">
                ✓ This trademark certificate has been verified successfully.
            </div>
        </div>

        <!-- Error Alert -->
        <div id="errorSection" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm font-medium mt-4">
            ✗ Trademark number not found or unverified.
        </div>
    </div>

    <!-- JavaScript Logic to Fetch and Verify -->
    <script>
        async function verifyTrademark() {
            const inputVal = document.getElementById('tmInput').value.trim();
            const resultSection = document.getElementById('resultSection');
            const errorSection = document.getElementById('errorSection');

            if(!inputVal) return;

            try {
                // data.json file theke dynamic vabe data fetch hobe
                const response = await fetch('data.json');
                const data = await response.json();

                if (data[inputVal]) {
                    const tmData = data[inputVal];
                    
                    // UI table-a data entry
                    document.getElementById('resNum').innerText = tmData.trademark_no;
                    document.getElementById('resStatus').innerText = tmData.status;
                    document.getElementById('resAuth').innerText = tmData.authority;

                    // Result show kora
                    resultSection.classList.remove('hidden');
                    errorSection.classList.add('hidden');
                } else {
                    resultSection.classList.add('hidden');
                    errorSection.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Data load korte somossa hoyeche:", error);
            }
        }
    </script>
</body>
</html>
