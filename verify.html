<!DOCTYPE html>
<html>
<head>
  <title>Trademark Verification</title>
  <style>
    body{
      font-family: Arial;
      text-align:center;
      background:#f5f5f5;
      padding:20px;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:900px;
      margin:auto;
    }

    iframe{
      width:100%;
      height:700px;
      border:none;
    }

    input{
      padding:10px;
      width:250px;
    }

    button{
      padding:10px 20px;
      background:green;
      color:white;
      border:none;
    }
  </style>
</head>

<body>

<div class="box">

<h2>Bangladesh Trademark Verification</h2>

<input type="text" id="tm" placeholder="Enter Trademark Number">

<button onclick="searchTM()">Verify</button>

<br><br>

<iframe id="pdf"></iframe>

</div>

<script>

function searchTM(){

  let id=document.getElementById("tm").value;

  window.location.href="?id="+id;

}

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

if(id){

document.getElementById("pdf").src=id+".pdf.pdf";

document.getElementById("tm").value=id;

}

</script>

</body>
</html>
