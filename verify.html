<!DOCTYPE html>
<html>

<head>

<title>Bangladesh Trademark Verification</title>

<style>

body{
font-family:Arial;
background:#edf5ef;
padding:20px;
text-align:center;
margin:0;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:1000px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
padding:12px;
width:250px;
font-size:16px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
background:#006a4e;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#004d39;
}

img.logo{
width:120px;
margin-top:10px;
}

.cert-img{
width:100%;
max-width:800px;
margin-top:20px;
border:1px solid #ddd;
}

iframe{
width:100%;
height:800px;
border:none;
margin-top:20px;
}

footer{
background:#006a4e;
color:white;
padding:15px;
margin-top:30px;
}

.verify{
color:#006a4e;
font-weight:bold;
font-size:18px;
}

.invalid{
padding:20px;
background:#ffecec;
color:red;
font-weight:bold;
border:1px solid red;
margin-top:20px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="box">

<img src="logo.jpeg" class="logo">

<h2 style="color:#006a4e;">
Government of the People's Republic of Bangladesh
</h2>

<p>
Department of Patents, Designs & Trademarks
</p>

<p class="verify">
✔ VERIFIED OFFICIAL DOCUMENT
</p>

<hr>

<h1 style="color:#006a4e;">
Bangladesh Trademark Verification
</h1>

<input type="text"
id="tm"
placeholder="Enter Trademark Number">

<button onclick="searchTM()">
Verify
</button>

<br><br>

<div id="result"></div>

</div>

<footer>

© 2024 Department of Patents,
Designs & Trademarks, Bangladesh.

</footer>

<script>

function searchTM(){

let id=document.getElementById("tm").value;

window.location.href="?id="+id;

}

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

if(id){

document.getElementById("tm").value=id;

document.getElementById("result").innerHTML=`

<img class="cert-img"
src="${id}.jpg"

onerror="showPDF()">

`;

}

function showPDF(){

fetch(id + ".pdf")

.then(response => {

if(response.ok){

document.getElementById("result").innerHTML=`

<iframe src="${id}.pdf"></iframe>

`;

}else{

showInvalid();

}

})

.catch(() => {

showInvalid();

});

}

function showInvalid(){

document.getElementById("result").innerHTML=`

<div class="invalid">

❌ Invalid Trademark Number

</div>

`;

}

</script>

</body>

</html>
