<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademark Verification System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

    <!-- Main Content Container -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-gray-100 text-center">
            
            <!-- Logo Section -->
            <div class="mb-6 flex justify-center">
                <img src="logo.jpeg" alt="Logo" class="h-20 w-20 object-contain rounded-full border border-gray-200 shadow-sm">
            </div>

            <h1 class="text-xl font-bold text-gray-800 mb-2">Government of the People's Republic of Bangladesh</h1>
            <p class="text-sm text-gray-500 mb-6">Department of Patents, Designs & Trademarks</p>

            <!-- Verification Input Form -->
            <div class="space-y-4">
                <input type="text" id="regNumber" placeholder="Enter Trademark / Application No." 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-center font-semibold">
                
                <button onclick="verifyTrademark()" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition shadow-md">
                    Verify Status
                </button>
            </div>

            <!-- Result Display Area -->
            <div id="result" class="mt-6 hidden p-4 rounded-lg text-left border"></div>

        </div>
    </div>

    <!-- Full Footer Section Start -->
    <div class="w-full bg-[#E9ECED] text-center py-6 border-t border-gray-300 mt-auto">
      
      <!-- Planning and Implementation Group -->
      <div class="mb-4">
        <p class="text-gray-700 text-sm font-medium tracking-wide px-4">
          Planning and Implementation: Cabinet Division, a2i, BCC, DoICT & BASIS.
        </p>
      </div>

      <!-- Technical Support Group with Image -->
      <div class="flex flex-col items-center justify-center">
        <p class="text-gray-600 text-xs font-semibold mb-3 tracking-wider uppercase">
          Technical Support:
        </p>
        <img src="footer-banner.png" alt="Technical Support Partners" class="h-10 md:h-12 object-contain mix-blend-multiply">
      </div>

    </div>
    <!-- Full Footer Section End -->

    <!-- JavaScript for Dynamic Verification -->
    <script>
        async function verifyTrademark() {
            const regNo = document.getElementById('regNumber').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!regNo) {
                alert('Please enter a number!');
                return;
            }

            try {
                // data.json file theke live data fetch kora
                const response = await fetch('data.json');
                const data = await response.json();

                if (data[regNo]) {
                    const info = data[regNo];
                    resultDiv.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700');
                    resultDiv.classList.add('bg-green-50', 'border-green-200', 'text-green-800');
                    
                    resultDiv.innerHTML = `
                        <div class="text-center font-bold text-lg text-green-700 mb-2">✓ Verified Valid</div>
                        <div class="space-y-1 text-sm text-gray-700">
                            <p><strong>Name:</strong> ${info.name}</p>
                            <p><strong>Authority:</strong> ${info.authority}</p>
                            <p><strong>Date:</strong> ${info.application_date}</p>
                        </div>
                    `;
                } else {
                    resultDiv.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'text-green-800');
                    resultDiv.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                    
                    resultDiv.innerHTML = `
                        <div class="text-center font-bold text-lg mb-1">✗ Record Not Found</div>
                        <p class="text-center text-sm text-gray-600">This Trademark / Application number is not registered in our system.</p>
                    `;
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Failed to load database. Please ensure data.json is configured correctly.');
            }
        }
    </script>

</body>
</html>
